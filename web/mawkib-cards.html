<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>كروت المواكب الحسينية</title><script src="qrcode.js"></script><script src="qrcode_UTF8.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eee8df;color:#211d1a;font-family:Tahoma,Arial,sans-serif}.bar{position:sticky;top:0;z-index:8;background:#16120f;color:#f3d486;padding:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.bar button,.bar select{min-height:42px;border:1px solid #9d783d;border-radius:10px;background:#2a2119;color:#f5d98d;font-weight:900}.wrap{padding:10px;max-width:900px;margin:auto}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#fff;border-radius:15px;padding:10px}.fields label{font-size:10px;font-weight:900;color:#66594f}.fields input,.fields textarea,.fields select{width:100%;margin-top:4px;padding:9px;border:1px solid #d4c3b3;border-radius:9px;background:#fff;color:#222;font:700 11px Tahoma}.fields textarea{min-height:65px;resize:vertical}.full{grid-column:1/-1}.preview-title{margin:12px 0 7px;font-weight:900}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;direction:ltr}.card{position:relative;aspect-ratio:85.6/54;overflow:hidden;border-radius:14px;box-shadow:0 8px 24px #0005;direction:rtl;background:#111;color:#f4dc9b}.safe{position:absolute;inset:3%;border:1px dashed #ffffff55;border-radius:10px;pointer-events:none}.orn{position:absolute;inset:0;opacity:.22;background:repeating-radial-gradient(circle at 15% 20%,transparent 0 11%,#d9b35a 11.5% 12%,transparent 12.5% 19%)}.logo{position:absolute;right:5%;top:8%;width:19%;height:30%;border-radius:50%;border:2px solid #d8b259;background:#fff2;display:grid;place-items:center;overflow:hidden;font-size:25px}.logo img{width:100%;height:100%;object-fit:cover}.name{position:absolute;right:27%;left:5%;top:11%;font-size:clamp(10px,3.2vw,24px);font-weight:900;text-align:center}.tag{position:absolute;right:8%;left:8%;top:43%;padding:3% 4%;border-top:2px solid #d8b259;border-bottom:2px solid #d8b259;text-align:center;font-size:clamp(7px,2vw,15px);font-weight:900}.foot{position:absolute;right:0;left:0;bottom:0;padding:3%;text-align:center;background:#d8b259;color:#17110b;font-weight:900;font-size:clamp(6px,1.6vw,12px)}.back-title{position:absolute;right:5%;top:8%;font-weight:900;font-size:clamp(8px,2.3vw,18px)}.info{position:absolute;right:5%;left:39%;top:24%;display:grid;gap:7%;font-size:clamp(6px,1.6vw,12px);font-weight:800}.row{padding:3%;border-bottom:1px solid #d8b25966}.qr{position:absolute;left:5%;top:24%;width:29%;aspect-ratio:1;background:#fff;padding:3%;border:2px solid #d8b259}.qr svg{width:100%!important;height:100%!important}.t2{background:linear-gradient(145deg,#052b20,#0a5b44);color:#f5e8b0}.t2 .foot{background:#bf9b4d}.t3{background:linear-gradient(145deg,#4a0710,#160407);color:#ffe0a2}.t3 .foot{background:#c59845}.t4{background:linear-gradient(145deg,#082947,#0b4e78);color:#f6e6b2}.t4 .foot{background:#d0a64f}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.actions button{min-height:44px;border:0;border-radius:11px;background:#087f72;color:#fff;font-weight:900}.actions button:nth-child(2){background:#91651d}.actions button:nth-child(3){background:#59463b}@media(max-width:520px){.pair{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.full{grid-column:1}.bar{grid-template-columns:1fr 1fr}.bar select{grid-column:1/-1}}@media print{.bar,.fields,.preview-title,.actions{display:none!important}.wrap{padding:0}.pair{display:block}.card{width:85.6mm;height:54mm;aspect-ratio:auto;border-radius:2.5mm;box-shadow:none;margin:0 auto;page-break-after:always}.safe{display:none}}</style></head><body><div class="bar"><button onclick="saveNow(true)">💾 حفظ</button><button onclick="resetForm()">🆕 جديد</button><select id="template"><option value="t1">نموذج أسود وذهبي</option><option value="t2">نموذج أخضر وذهبي</option><option value="t3">نموذج خمري وذهبي</option><option value="t4">نموذج أزرق وذهبي</option></select></div><div class="wrap"><div class="fields"><label>اسم الموكب<input id="name" value="موكب أنصار الحسين عليه السلام"></label><label>المناسبة<input id="occasion" value="خدمة زوار الإمام الحسين عليه السلام"></label><label>اسم المسؤول<input id="manager" value=""></label><label>رقم الهاتف<input id="phone" inputmode="tel" value=""></label><label>العنوان / الموقع<input id="address" value=""></label><label>رقم أو رمز الكارت<input id="code" value="001"></label><label class="full">وصف أو ملاحظة<textarea id="note">خدمة الزائر شرف لنا</textarea></label><label class="full">شعار أو صورة<input id="logoInput" type="file" accept="image/*"></label></div><div class="preview-title">معاينة الوجه والظهر — CR80 85.6 × 54 ملم</div><div class="pair"><div id="front" class="card t1"><div class="orn"></div><div class="safe"></div><div id="logo" class="logo">🏴</div><div id="pName" class="name"></div><div id="pOccasion" class="tag"></div><div id="pFoot" class="foot"></div></div><div id="back" class="card t1"><div class="orn"></div><div class="safe"></div><div class="back-title">بيانات الموكب</div><div class="info"><div class="row" id="pManager"></div><div class="row" id="pPhone"></div><div class="row" id="pAddress"></div><div class="row" id="pCode"></div><div class="row" id="pNote"></div></div><div id="qr" class="qr"></div><div class="foot">مكتبة أبو بسام للتصوير والقرطاسية</div></div></div><div class="actions"><button onclick="printCards()">🖨 طباعة</button><button onclick="savePdf()">📄 حفظ PDF</button><button onclick="saveNow(true)">💾 حفظ التعديلات</button></div></div><script>const KEY='abuBassamMawkibCardsV1';const ids=['name','occasion','manager','phone','address','code','note','template'];let logoData='';function q(id){return document.getElementById(id)}function state(){let o={};ids.forEach(id=>o[id]=q(id).value);o.logo=logoData;return o}function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){ids.forEach(id=>{if(s[id]!=null)q(id).value=s[id]});logoData=s.logo||''}}catch(e){}render()}function saveNow(msg){try{localStorage.setItem(KEY,JSON.stringify(state()));if(msg)alert('تم حفظ كارت الموكب ✓')}catch(e){if(msg)alert('تعذر الحفظ')}}function resetForm(){if(!confirm('بدء كارت موكب جديد؟'))return;localStorage.removeItem(KEY);location.reload()}function renderQr(text){let box=q('qr');box.innerHTML='';try{let qr=qrcode(0,'M');qr.addData(text||'موكب حسيني');qr.make();box.innerHTML=qr.createSvgTag({cellSize:3,margin:0,scalable:true})}catch(e){box.textContent=text||'QR'}}function render(){let t=q('template').value;['front','back'].forEach(id=>q(id).className='card '+t);q('pName').textContent=q('name').value||'اسم الموكب';q('pOccasion').textContent=q('occasion').value||'المناسبة';q('pFoot').textContent=(q('phone').value?'للتواصل: '+q('phone').value:'خدمة زوار الإمام الحسين عليه السلام');q('pManager').textContent='المسؤول: '+(q('manager').value||'................');q('pPhone').textContent='الهاتف: '+(q('phone').value||'................');q('pAddress').textContent='العنوان: '+(q('address').value||'................');q('pCode').textContent='الرمز: '+(q('code').value||'................');q('pNote').textContent=q('note').value||'';q('logo').innerHTML=logoData?'<img src="'+logoData+'">':'🏴';renderQr([q('name').value,q('manager').value,q('phone').value,q('address').value,q('code').value].filter(Boolean).join(' | '));saveNow(false)}function printable(){let clone=document.documentElement.cloneNode(true);clone.querySelectorAll('script,.bar,.fields,.preview-title,.actions').forEach(n=>n.remove());return '<!doctype html>'+clone.outerHTML}function printCards(){saveNow(false);let html=printable();try{if(parent.Android&&parent.Android.printHtml)return parent.Android.printHtml(html)}catch(e){}window.print()}function savePdf(){saveNow(false);let html=printable(),name='Mawkib_Card_'+Date.now()+'.pdf';try{if(parent.Android&&parent.Android.savePdfHtml)return parent.Android.savePdfHtml(name,html)}catch(e){}alert('حفظ PDF متاح داخل تطبيق Android')}ids.forEach(id=>q(id).addEventListener('input',render));q('template').addEventListener('change',render);q('logoInput').addEventListener('change',e=>{let f=e.target.files&&e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{logoData=r.result;render()};r.readAsDataURL(f)});load();</script></body></html>
