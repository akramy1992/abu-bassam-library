<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>النماذج</title><script src="card-template-library.js"></script><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#f6f0e8;color:#2b231e;font-family:Tahoma,Arial,sans-serif}.head{padding:14px;border-radius:16px;background:linear-gradient(135deg,#06483e,#087f72,#a7772e);color:#fff;margin-bottom:12px}.head h2{margin:0;font-size:18px;line-height:1.4}.head p{margin:6px 0 0;font-size:11px;line-height:1.7}.catalog{display:grid;gap:10px}.group{border:1px solid #d9c8ba;border-radius:16px;background:#fff;box-shadow:0 5px 15px #00000010;overflow:hidden}.group-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;background:#fffaf4;border-bottom:1px solid #eadfd5}.group-title{display:flex;align-items:center;gap:8px;min-width:0}.group-title .icon{font-size:26px;line-height:1}.group-title b{font-size:13px;line-height:1.45;white-space:normal;overflow-wrap:anywhere}.count{flex:0 0 auto;min-width:62px;padding:5px 8px;border-radius:999px;background:#087f7214;color:#087f72;text-align:center;font-size:9px;font-weight:900}.models{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:10px}.model{width:100%;border:1px solid #d9c8ba;border-radius:13px;background:#fff;color:#3d312a;padding:7px;font-size:9px;font-weight:900;line-height:1.4;text-align:center;display:grid;gap:6px;align-content:start;min-width:0}.model-preview{position:relative;width:100%;aspect-ratio:85.6/54;border-radius:8px;overflow:hidden;background:linear-gradient(145deg,#fffdf7,#e9eee9);border:1px solid #cdbda9;box-shadow:0 2px 7px #0002}.model-preview .p-brand,.model-preview .p-title,.model-preview .p-photo,.model-preview .p-code,.model-preview .p-line,.model-preview .p-accent{position:absolute;border-radius:5px}.model-preview .p-brand{background:#075b4d}.model-preview .p-title{background:#d9ad52}.model-preview .p-photo{background:linear-gradient(145deg,#dce7e2,#fff);border:2px solid #d9ad52}.model-preview .p-code{background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 4px);border:2px solid #fff}.model-preview .p-line{background:#075b4d33}.model-preview .p-accent{background:#d9ad5244}.model-preview.v1 .p-brand{right:8%;left:42%;top:8%;height:18%}.model-preview.v1 .p-photo{left:6%;top:15%;width:30%;height:60%}.model-preview.v1 .p-title{right:40%;left:7%;bottom:10%;height:22%}.model-preview.v1 .p-code{left:8%;bottom:8%;width:20%;height:20%}.model-preview.v2 .p-brand{right:6%;left:66%;top:9%;height:65%}.model-preview.v2 .p-photo{right:39%;top:18%;width:27%;height:57%}.model-preview.v2 .p-title{left:6%;right:70%;top:20%;height:45%}.model-preview.v2 .p-code{left:7%;bottom:8%;width:22%;height:22%}.model-preview.v3 .p-brand{right:16%;left:16%;top:6%;height:14%}.model-preview.v3 .p-photo{left:36%;top:25%;width:28%;height:42%;border-radius:50%}.model-preview.v3 .p-title{right:20%;left:20%;bottom:8%;height:16%}.model-preview.v3 .p-code{left:39%;top:29%;width:22%;height:22%}.model-preview.v4 .p-brand{right:7%;left:58%;top:8%;height:20%}.model-preview.v4 .p-photo{left:6%;top:15%;width:37%;height:65%}.model-preview.v4 .p-title{right:48%;left:7%;top:42%;height:25%}.model-preview.v4 .p-accent{right:-8%;left:30%;top:31%;height:13%;transform:rotate(-8deg)}.model-preview.v5 .p-brand{right:8%;left:8%;top:7%;height:15%}.model-preview.v5 .p-photo{left:7%;top:28%;width:26%;height:52%;border-radius:45% 12%}.model-preview.v5 .p-title{right:36%;left:8%;bottom:10%;height:23%;clip-path:polygon(7% 0,100% 0,93% 100%,0 100%)}.model-preview.v5 .p-code{left:10%;bottom:13%;width:18%;height:18%}.model-preview.v6 .p-brand{right:8%;left:55%;top:8%;height:22%}.model-preview.v6 .p-photo{right:6%;top:32%;width:30%;height:54%;border-radius:50%}.model-preview.v6 .p-title{right:41%;left:7%;top:46%;height:22%}.model-preview.v6 .p-code{left:8%;top:25%;width:26%;height:26%}.model-preview.v7 .p-brand{right:6%;left:72%;top:7%;height:78%}.model-preview.v7 .p-photo{left:8%;top:17%;width:28%;height:60%}.model-preview.v7 .p-title{right:34%;left:41%;top:22%;height:43%}.model-preview.v7 .p-code{left:10%;bottom:9%;width:21%;height:21%}.model-preview.v8 .p-brand{right:7%;left:55%;top:7%;height:18%}.model-preview.v8 .p-photo{left:5%;top:13%;width:39%;height:68%;transform:rotate(-4deg)}.model-preview.v8 .p-title{right:47%;left:5%;top:45%;height:24%;transform:rotate(2deg)}.model-preview.v8 .p-accent{right:-12%;left:28%;top:31%;height:12%;transform:rotate(-7deg)}.model-preview.v9{box-shadow:inset 0 0 0 3px #d9ad52}.model-preview.v9 .p-brand{right:10%;left:10%;top:6%;height:14%}.model-preview.v9 .p-photo{left:36%;top:24%;width:28%;height:42%;border-radius:50%}.model-preview.v9 .p-title{right:24%;left:24%;bottom:7%;height:15%;border-radius:999px}.model-preview.v9 .p-code{left:39%;top:31%;width:22%;height:22%}.model-preview.v10 .p-brand{right:7%;left:53%;top:7%;height:19%}.model-preview.v10 .p-photo{left:6%;top:16%;width:30%;height:61%}.model-preview.v10 .p-title{right:40%;left:7%;top:45%;height:23%}.model-preview.v10 .p-accent{left:-7%;top:-4%;width:40%;height:110%;clip-path:polygon(0 0,100% 0,72% 100%,0 100%)}.group[data-id="child"] .model-preview{background:linear-gradient(145deg,#effbff,#fff6d9)}.group[data-id="child"] .p-brand{background:#178cc3}.group[data-id="child"] .p-title{background:#ffc44d}.group[data-id="login"] .model-preview{background:linear-gradient(145deg,#171717,#090909);border-color:#9d783d}.group[data-id="login"] .p-brand,.group[data-id="login"] .p-line{background:#c9a15b}.group[data-id="login"] .p-title{background:#f0d291}.group[data-id="wifi"] .model-preview{background:linear-gradient(145deg,#061c2e,#0c5b76);border-color:#39d9e6}.group[data-id="wifi"] .p-brand{background:#39d9e6}.group[data-id="wifi"] .p-title{background:#ffffff33}.group[data-id="qr"] .model-preview .p-code,.group[data-id="ration"] .model-preview .p-code,.group[data-id="mawkib"] .model-preview .p-code{display:block}.group[data-id="ration"] .model-preview{background:#fff8e9}.group[data-id="mawkib"] .model-preview{background:#211915;border-color:#9a7336}.group[data-id="mawkib"] .p-brand,.group[data-id="mawkib"] .p-title{background:#d8b259}.group[data-id="student-thanks"] .model-preview,.group[data-id="certificate"] .model-preview,.group[data-id="thanks"] .model-preview{aspect-ratio:210/148;background:#fffef9}.group[data-id="student-thanks"] .p-photo,.group[data-id="certificate"] .p-photo,.group[data-id="thanks"] .p-photo{display:none}.group[data-id="student-thanks"] .p-brand,.group[data-id="certificate"] .p-brand,.group[data-id="thanks"] .p-brand{right:14%;left:14%;top:9%;height:8%}.group[data-id="student-thanks"] .p-title,.group[data-id="certificate"] .p-title,.group[data-id="thanks"] .p-title{right:21%;left:21%;top:25%;height:14%}.group[data-id="student-thanks"] .p-line,.group[data-id="certificate"] .p-line,.group[data-id="thanks"] .p-line{right:14%;left:14%;top:51%;height:6%}.group[data-id="envelope"] .model-preview{aspect-ratio:225/115}.group[data-id="envelope"] .p-photo,.group[data-id="envelope"] .p-code{display:none}.model-name{min-height:30px;display:grid;place-items:center;white-space:normal;overflow-wrap:anywhere}.model:active{transform:scale(.985)}.group[data-id="mawkib"] .model{color:#6f511e;border-color:#c7a45f}.note{margin-top:12px;padding:10px;border-radius:12px;background:#fff;color:#756b65;font-size:10px;line-height:1.8}@media(max-width:420px){body{padding:9px}.models{gap:7px;padding:8px}.model{font-size:8px;padding:6px}.group-title b{font-size:12px}.count{min-width:55px;font-size:8px}}@media(max-width:330px){.models{grid-template-columns:1fr}}</style></head><body><div class="head"><h2 id="catalogTitle">🧩 جميع النماذج المتفق عليها</h2><p id="catalogSubtitle">اختر النموذج من معاينته المصغرة، ثم عدّل جميع العناصر داخل التصميم.</p></div><div id="catalog" class="catalog"></div><div class="note">كل معاينة تبيّن توزيع العناصر الفعلي المختلف للنموذج. تغيير اللون وحده لا يُحسب نموذجًا مستقلًا.</div><script>const lib=Array.isArray(window.AbuBassamCardTemplateLibrary)?window.AbuBassamCardTemplateLibrary:[];const requestedSection=decodeURIComponent((location.hash||'').replace(/^#/,''));const selectedGroup=requestedSection?lib.find(g=>g.id===requestedSection):null;const visibleLib=selectedGroup?[selectedGroup]:lib;const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function closeModal(){try{parent.document.getElementById('abuRecoveryModal').style.display='none'}catch(e){}}function choose(type,model){try{parent.CardsStudio.selectType(type);if(type==='child'&&model&&parent.AbuBassamChildTemplates?.select)parent.AbuBassamChildTemplates.select(model,false);else if(model&&parent.AbuBassamCardModels?.select)parent.AbuBassamCardModels.select(type,model,false);closeModal()}catch(e){alert('تعذر فتح النموذج')}}function openRoute(title,route,model){const src=route+(model?'#'+encodeURIComponent(model):'');try{parent.document.getElementById('abuRecoveryTitle').textContent=title;parent.document.getElementById('abuRecoveryFrame').src=src}catch(e){location.href=src}}function use(g,m){if(g.type){choose(g.type,m.id);return}openRoute(g.title,g.route,m.id)}function preview(g,index){const cls='v'+((index%10)+1);return '<div class="model-preview '+cls+'" aria-hidden="true"><span class="p-accent"></span><span class="p-brand"></span><span class="p-photo"></span><span class="p-title"></span><span class="p-line"></span><span class="p-code"></span></div>'}function render(){const title=document.getElementById('catalogTitle'),subtitle=document.getElementById('catalogSubtitle');if(selectedGroup){document.title='نماذج '+selectedGroup.title;title.textContent=selectedGroup.icon+' نماذج '+selectedGroup.title;subtitle.textContent='اضغط على المعاينة لاختيار النموذج.'}const host=document.getElementById('catalog');host.innerHTML=visibleLib.map((g,gi)=>'<section class="group" data-id="'+esc(g.id)+'"><div class="group-head"><div class="group-title"><span class="icon">'+esc(g.icon)+'</span><b>'+esc(g.title)+'</b></div><span class="count">'+g.models.length+' '+(g.models.length===1?'نموذج':'نماذج')+'</span></div><div class="models">'+g.models.map((m,mi)=>'<button class="model" data-g="'+gi+'" data-m="'+mi+'">'+preview(g,mi)+'<span class="model-name">'+esc(m.name)+'</span></button>').join('')+'</div></section>').join('');host.querySelectorAll('.model').forEach(b=>b.onclick=()=>{const g=visibleLib[Number(b.dataset.g)],m=g.models[Number(b.dataset.m)];use(g,m)})}render();</script></body></html>
