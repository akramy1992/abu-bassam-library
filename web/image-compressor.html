<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ضغط الصور</title>
<style>
@font-face{font-family:Tajawal;src:url('fonts/Tajawal-Regular.ttf') format('truetype');font-weight:400 900;font-display:swap}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#020617;color:#fff;font-family:Tajawal,sans-serif}body{overflow-y:auto}.app{width:min(100%,520px);margin:auto;min-height:100vh;padding:14px 14px 26px;background:radial-gradient(circle at top left,#0a1128,#01040a)}h1{margin:0;color:#00e5ff;font-size:27px}.sub{font-size:10px;color:#94a3b8;line-height:1.7;margin:4px 0 12px}.upload{border:2px dashed #00e5ff;border-radius:16px;padding:16px;text-align:center;background:#00e5ff08;min-height:100px;display:grid;place-items:center;cursor:pointer}.upload.drag{background:#00e5ff22;border-color:#fff}.upload b{font-size:14px}.upload small{display:block;color:#64748b;margin-top:4px}.settings{margin-top:10px;background:#0b1230cc;border:1px solid #007bff55;border-radius:14px;padding:10px}.row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-bottom:10px;font-size:11px;font-weight:800}.row select,.row input[type=range]{width:100%}.row select{min-height:38px;border-radius:9px;border:1px solid #334155;background:#111827;color:#fff;padding:6px}.badge{background:#7c3aed;border-radius:8px;padding:4px 7px;font-size:10px}.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.preset{border:1px solid #334155;background:#020617;color:#94a3b8;border-radius:9px;padding:7px 3px;font-size:9px;font-weight:900}.preset.on{border-color:#00e5ff;color:#00e5ff;background:#00e5ff0b}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.btn{min-height:42px;border:0;border-radius:11px;font-family:Tajawal;font-weight:900}.primary{background:linear-gradient(90deg,#7c3aed,#d946ef);color:#fff}.secondary{background:#0f766e;color:#fff}.danger{background:#b91c1c;color:#fff}.ghost{background:#1e293b;color:#fff}.selected,.results{margin-top:10px;display:grid;gap:7px}.item{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center;background:#0f172a;border:1px solid #334155;border-radius:12px;padding:7px}.item img{width:58px;height:58px;object-fit:cover;border-radius:8px;background:#111}.meta{min-width:0}.meta b{font-size:10px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta small{font-size:8px;color:#94a3b8;line-height:1.5}.actions{display:grid;grid-template-columns:repeat(2,30px);gap:4px}.actions button{width:30px;height:30px;border:0;border-radius:8px;background:#1e293b;color:#fff}.summary{display:none;margin-top:10px;padding:9px;border-radius:11px;background:#0f766e22;border:1px solid #0f766e88;font-size:9px;line-height:1.7}.summary.show{display:block}.preview{display:none;margin-top:10px;background:#020617;border:1px solid #334155;border-radius:14px;padding:9px}.preview.show{display:block}.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.preview figure{margin:0}.preview img{width:100%;height:150px;object-fit:contain;background:#111827;border-radius:9px}.preview figcaption{text-align:center;font-size:8px;color:#94a3b8;margin-top:4px}.quality{font-size:8px;margin-top:3px}.q-good{color:#34d399}.q-mid{color:#fbbf24}.q-bad{color:#f87171}.progress{font-size:9px;color:#cbd5e1;margin-top:8px;text-align:center}.savebar{display:none;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.savebar.show{display:grid}.credit{text-align:center;color:#64748b;font-size:9px;margin-top:16px}@media(max-width:390px){.presets{grid-template-columns:1fr 1fr}.preview img{height:120px}}
</style>
</head>
<body>
<div class="app">
  <h1>🗜️ ضغط الصور</h1>
  <div class="sub">ضغط محلي داخل الهاتف • معاينة قبل/بعد • لا يتم تعديل الصورة الأصلية</div>
  <div id="uploadArea" class="upload" role="button" tabindex="0"><div><div style="font-size:30px">🖼️</div><b>اضغط أو اسحب الصور هنا</b><small>حتى 20 صورة وبحد إجمالي 80 MB للدفعة</small></div></div>
  <input id="fileInput" type="file" multiple accept="image/*" hidden>
  <div class="settings">
    <div class="row"><span>الجودة</span><input id="quality" type="range" min="20" max="100" value="75"><span id="qualityValue" class="badge">75%</span></div>
    <div class="presets"><button class="preset" data-q="90">💎 عالية</button><button class="preset on" data-q="75">🚀 متوازنة</button><button class="preset" data-q="55">🍃 متوسطة</button><button class="preset" data-q="35">⚡ قوية</button></div>
    <div class="row" style="margin:10px 0 0"><span>الدقة</span><select id="maxDimension"><option value="0">الأصلية — مع حد أمان للذاكرة</option><option value="4000">حد أقصى 4000px</option><option value="3000">حد أقصى 3000px</option><option value="2000">حد أقصى 2000px</option></select><span></span></div>
  </div>
  <div id="selectedList" class="selected"></div>
  <div class="toolbar"><button id="processBtn" class="btn primary">🗜️ ضغط ومعاينة</button><button id="clearBtn" class="btn ghost">مسح القائمة</button></div>
  <div id="cancelWrap" class="toolbar" style="display:none"><button id="cancelBtn" class="btn danger" style="grid-column:1/-1">إلغاء المعالجة</button></div>
  <div id="progress" class="progress"></div><div id="summary" class="summary"></div>
  <div id="preview" class="preview"><div class="preview-grid"><figure><img id="beforeImg"><figcaption>قبل</figcaption></figure><figure><img id="afterImg"><figcaption>بعد</figcaption></figure></div><div id="previewText" class="progress"></div></div>
  <div id="results" class="results"></div>
  <div id="saveBar" class="savebar"><button id="saveBtn" class="btn secondary">💾 حفظ النتائج</button><button id="newBtn" class="btn ghost">دفعة جديدة</button></div>
  <div class="credit">برمجة: أكرم حاتم الغزالي</div>
</div>
<script>
const MAX_FILES=20,MAX_TOTAL_BYTES=80*1024*1024,SAFE_MAX_PIXELS=24_000_000;
const $=id=>document.getElementById(id);let selected=[],results=[],cancelRequested=false,processing=false;
const fmt=n=>{n=Number(n)||0;if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(2)+' MB'};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeBase=name=>String(name||'image').replace(/\.[^.]+$/,'').replace(/[\\/:*?"<>|]/g,'_').trim()||'image';
const isImageFile=f=>String(f?.type||'').startsWith('image/')||/\.(?:jpe?g|png|webp)$/i.test(String(f?.name||''));
function revoke(item){try{if(item?.url)URL.revokeObjectURL(item.url)}catch(_){}}
function resetResults(){results=[];$('results').innerHTML='';$('summary').classList.remove('show');$('summary').textContent='';$('preview').classList.remove('show');$('saveBar').classList.remove('show');$('progress').textContent=''}
function currentBytes(){return selected.reduce((s,x)=>s+(Number(x.file?.size)||0),0)}
function acceptFiles(files){const incoming=[...files];if(incoming.some(f=>!isImageFile(f)))return alert('يوجد ملف غير صوري وتم رفض الدفعة.');if(selected.length+incoming.length>MAX_FILES)return alert(`الحد الأقصى ${MAX_FILES} صورة.`);const incomingBytes=incoming.reduce((s,f)=>s+(Number(f.size)||0),0);if(currentBytes()+incomingBytes>MAX_TOTAL_BYTES)return alert('الحجم الإجمالي بعد الإضافة سيتجاوز 80 MB. قسّم الصور إلى دفعتين.');incoming.forEach(file=>selected.push({id:(crypto.randomUUID?.()||Date.now()+'-'+Math.random()),file,url:URL.createObjectURL(file)}));resetResults();renderSelected()}
function renderSelected(){$('selectedList').innerHTML=selected.map((x,i)=>`<div class="item" data-id="${esc(x.id)}"><img src="${x.url}"><div class="meta"><b>${esc(x.file.name)}</b><small>${fmt(x.file.size)} • ${esc(x.file.type||'image')}</small></div><div class="actions"><button onclick="moveItem(${i},-1)" aria-label="للأعلى">↑</button><button onclick="moveItem(${i},1)" aria-label="للأسفل">↓</button><button onclick="previewOriginal(${i})" aria-label="معاينة">👁</button><button onclick="removeItem(${i})" aria-label="حذف">×</button></div></div>`).join('');$('processBtn').disabled=!selected.length}
window.moveItem=(i,d)=>{const j=i+d;if(j<0||j>=selected.length)return;[selected[i],selected[j]]=[selected[j],selected[i]];resetResults();renderSelected()};
window.removeItem=i=>{if(processing)return;revoke(selected[i]);selected.splice(i,1);resetResults();renderSelected()};
window.previewOriginal=i=>{const x=selected[i];if(!x)return;$('beforeImg').src=x.url;$('afterImg').removeAttribute('src');$('previewText').textContent=`${x.file.name} • ${fmt(x.file.size)}`;$('preview').classList.add('show')};
function readDataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result||''));r.onerror=()=>rej(r.error||new Error('تعذر قراءة الملف'));r.readAsDataURL(file)})}
function loadImage(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('تعذر فك الصورة'));im.src=src})}
function blobUrlData(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result||''));r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
function outType(file){const t=String(file.type||'').toLowerCase(),n=String(file.name||'').toLowerCase();if(t==='image/png'||n.endsWith('.png'))return'image/png';if(t==='image/webp'||n.endsWith('.webp'))return'image/webp';return'image/jpeg'}
function extFor(mime){return mime==='image/png'?'png':mime==='image/webp'?'webp':'jpg'}
function assess(w,h,q){const min=Math.min(w,h);if(min>=2400&&q>=.72)return{label:'ممتازة للطباعة',cls:'q-good'};if(min>=1600&&q>=.58)return{label:'جيدة للطباعة',cls:'q-good'};if(min>=1000&&q>=.42)return{label:'متوسطة — راجع المعاينة',cls:'q-mid'};return{label:'ضعيفة للطباعة الكبيرة',cls:'q-bad'}}
function calcSize(w,h){const maxDim=Number($('maxDimension').value)||0;let scale=1;if(maxDim>0)scale=Math.min(scale,maxDim/Math.max(w,h));if(w*h*scale*scale>SAFE_MAX_PIXELS)scale=Math.min(scale,Math.sqrt(SAFE_MAX_PIXELS/(w*h)));return{w:Math.max(1,Math.round(w*scale)),h:Math.max(1,Math.round(h*scale)),scale}}
async function compressOne(item,index){const file=item.file,img=await loadImage(item.url),sw=img.naturalWidth||img.width,sh=img.naturalHeight||img.height;if(!sw||!sh)throw new Error('أبعاد الصورة غير صالحة');const size=calcSize(sw,sh),mime=outType(file),canvas=document.createElement('canvas');canvas.width=size.w;canvas.height=size.h;const ctx=canvas.getContext('2d',{alpha:mime!=='image/jpeg'});if(!ctx)throw new Error('تعذر تشغيل محرر الصور');if(mime==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,size.w,size.h)}ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,size.w,size.h);const encode=q=>new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error('تعذر إنشاء النسخة المضغوطة')),mime,mime==='image/png'?undefined:q));let q=Math.max(.2,Math.min(1,Number($('quality').value)/100||.75)),blob=await encode(q);if(mime==='image/jpeg'||mime==='image/webp'){while(blob.size>=file.size&&q>.3){q=Math.max(.3,Number((q-.1).toFixed(2)));blob=await encode(q)}}let unchanged=false,dataUrl;if(blob.size>=file.size&&size.scale===1){unchanged=true;dataUrl=await readDataUrl(file);blob=file}else dataUrl=await blobUrlData(blob);const quality=assess(size.w,size.h,mime==='image/png'?1:q),base=safeBase(file.name),name=`${base}_compressed_${index+1}.${extFor(mime)}`;return{id:item.id,name,mime,dataUrl,originalName:file.name,originalBytes:file.size,compressedBytes:blob.size,width:size.w,height:size.h,originalWidth:sw,originalHeight:sh,quality:quality.label,qualityClass:quality.cls,unchanged}}
function renderResults(){$('results').innerHTML=results.map((r,i)=>{if(r.error)return`<div class="item"><div style="font-size:25px">⚠️</div><div class="meta"><b>${esc(r.originalName)}</b><small class="q-bad">${esc(r.error)}</small></div></div>`;const saved=r.originalBytes-r.compressedBytes,pct=r.originalBytes?Math.round(saved/r.originalBytes*100):0;return`<div class="item"><img src="${r.dataUrl}" onclick="showResult(${i})"><div class="meta"><b>${esc(r.name)}</b><small>${fmt(r.originalBytes)} ← ${fmt(r.compressedBytes)} ${saved>=0?`• توفير ${pct}%`:''}<br>${r.width}×${r.height}</small><div class="quality ${r.qualityClass}">${esc(r.quality)}${r.unchanged?' • الأصل أصغر فتم الإبقاء عليه':''}</div></div><div class="actions"><button onclick="showResult(${i})">👁</button></div></div>`}).join('');$('saveBar').classList.toggle('show',results.some(r=>!r.error));if(results.some(r=>!r.error))showResult(results.findIndex(r=>!r.error));}
window.showResult=i=>{const r=results[i];if(!r||r.error)return;const src=selected.find(x=>x.id===r.id);$('beforeImg').src=src?.url||'';$('afterImg').src=r.dataUrl;$('previewText').textContent=`${r.originalName}: ${fmt(r.originalBytes)} → ${fmt(r.compressedBytes)} • ${r.width}×${r.height} • ${r.quality}`;$('preview').classList.add('show')};
async function processAll(){if(!selected.length||processing)return;processing=true;cancelRequested=false;resetResults();$('processBtn').disabled=true;$('cancelWrap').style.display='grid';$('cancelBtn').textContent='إلغاء المعالجة';let ok=0,fail=0,orig=0,out=0;for(let i=0;i<selected.length;i++){if(cancelRequested)break;$('progress').textContent=`معالجة ${i+1} من ${selected.length}...`;try{const r=await compressOne(selected[i],i);results.push(r);ok++;orig+=r.originalBytes;out+=r.compressedBytes}catch(e){results.push({id:selected[i].id,originalName:selected[i].file.name,error:String(e?.message||e)});fail++}await new Promise(r=>setTimeout(r,0))}processing=false;$('cancelWrap').style.display='none';$('processBtn').disabled=!selected.length;renderResults();$('summary').textContent=cancelRequested?`تم الإلغاء. أُنجزت ${ok} صورة قبل الإلغاء.`:`نجح: ${ok}${fail?` • تعذر: ${fail}`:''} • قبل: ${fmt(orig)} • بعد: ${fmt(out)}${orig?` • التوفير: ${Math.max(0,Math.round((orig-out)/orig*100))}%`:''}`;$('summary').classList.add('show');$('progress').textContent=''}
function namedDataUrl(dataUrl,name){const s=String(dataUrl||''),marker=';base64,';const at=s.indexOf(marker);if(at<0)return s;return `${s.slice(0,at)};name=${encodeURIComponent(name)}${marker}${s.slice(at+marker.length)}`}
function browserSave(name,data){const a=document.createElement('a');a.download=name;a.href=data;document.body.appendChild(a);a.click();a.remove()}
function saveResults(){const good=results.filter(r=>!r.error);if(!good.length)return alert('لا توجد نتائج صالحة للحفظ.');if(window.parent?.Android?.savePagesToGallery){const pages=good.map(r=>namedDataUrl(r.dataUrl,r.name));window.parent.postMessage({type:'abuCompressionReady',pages,originalBytes:good.reduce((s,r)=>s+r.originalBytes,0),compressedBytes:good.reduce((s,r)=>s+r.compressedBytes,0),failedCount:results.length-good.length},'*')}else{good.forEach(r=>browserSave(r.name,r.dataUrl));alert(`تم تجهيز ${good.length} صورة للحفظ.`)}}
function clearAll(){if(processing)return;selected.forEach(revoke);selected=[];resetResults();renderSelected()}
$('uploadArea').onclick=()=>$('fileInput').click();$('uploadArea').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('fileInput').click()}};$('fileInput').onchange=e=>{acceptFiles([...(e.target.files||[])]);e.target.value=''};
['dragenter','dragover'].forEach(ev=>$('uploadArea').addEventListener(ev,e=>{e.preventDefault();$('uploadArea').classList.add('drag')}));['dragleave','drop'].forEach(ev=>$('uploadArea').addEventListener(ev,e=>{e.preventDefault();$('uploadArea').classList.remove('drag')}));$('uploadArea').addEventListener('drop',e=>acceptFiles([...(e.dataTransfer?.files||[])]));
$('quality').oninput=e=>{$('qualityValue').textContent=e.target.value+'%';document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('on',b.dataset.q===e.target.value));resetResults()};document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{$('quality').value=b.dataset.q;$('qualityValue').textContent=b.dataset.q+'%';document.querySelectorAll('.preset').forEach(x=>x.classList.toggle('on',x===b));resetResults()});$('maxDimension').onchange=resetResults;$('processBtn').onclick=processAll;$('cancelBtn').onclick=()=>{cancelRequested=true;$('cancelBtn').textContent='جارٍ الإلغاء...'};$('clearBtn').onclick=clearAll;$('saveBtn').onclick=saveResults;$('newBtn').onclick=clearAll;
window.addEventListener('message',e=>{if(e.data?.type==='abuBassamTabVisible')setTimeout(()=>window.dispatchEvent(new Event('resize')),30)});window.addEventListener('beforeunload',()=>selected.forEach(revoke));renderSelected();
</script>
</body>
</html>
