<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>كتاب الشكر والتقدير</title><style>*{box-sizing:border-box}body{margin:0;background:#e9edf2;color:#222;font-family:Tahoma,Arial,sans-serif}.toolbar{position:sticky;top:0;z-index:9;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;background:#24374a}.toolbar button,.toolbar select{min-height:41px;border:0;border-radius:9px;background:#fff;color:#24374a;font-weight:900;font-size:10px}.toolbar button.primary{background:#1f8a70;color:#fff}.workspace{padding:12px}.fields{max-width:900px;margin:0 auto 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#fff;border-radius:14px;padding:10px}.fields label{font-size:10px;font-weight:900;color:#5b6570}.fields input,.fields textarea{width:100%;margin-top:4px;border:1px solid #cdd5dd;border-radius:9px;padding:9px;background:#fff;color:#222;font:700 11px Tahoma}.fields textarea{min-height:72px;resize:vertical}.full{grid-column:1/-1}.paper-wrap{overflow:auto;padding:8px}.paper{position:relative;width:794px;min-height:1123px;margin:auto;background:#fff;padding:72px 76px 72px;box-shadow:0 10px 28px #0004;overflow:hidden;isolation:isolate}.paper>*{position:relative;z-index:3}.paper:before,.paper:after{content:'';position:absolute;pointer-events:none;z-index:1}.paper:before{inset:22px;border:4px double #b68a3e}.paper:after{inset:35px;border:1px solid #d8c9aa}.logo{width:95px;height:95px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;border:3px solid #b68a3e;font-size:45px;background:#fff}.org{text-align:center;font-weight:900;font-size:18px}.title{text-align:center;margin:30px 0 20px;font-size:34px;font-weight:900;color:#7d5417}.to{text-align:center;font-size:24px;font-weight:900;margin:20px 0}.body{font-size:20px;line-height:2.15;text-align:justify;margin-top:24px;white-space:pre-wrap}.reason{margin-top:20px;padding:15px;border-right:5px solid #b68a3e;background:#fbf7ee;font-size:18px;line-height:1.9}.footer-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:55px;text-align:center;font-size:17px;line-height:1.8}.signature{font-weight:900}.date{color:#555}.designer{position:absolute!important;left:55px;bottom:42px;font-size:11px;color:#999;z-index:5}
/* 1 — الإطار الملكي: إطار مركزي كلاسيكي */
.t1{background:linear-gradient(180deg,#fff,#fffdf7)}
/* 2 — الشريط الجانبي: تخطيط جانبي حقيقي */
.t2{padding:82px 96px 72px 185px;background:#fbfffd}.t2:before{inset:0 auto 0 0;width:138px;border:0;background:linear-gradient(180deg,#064f43,#0b806c)}.t2:after{inset:25px 25px 25px 160px;border:2px solid #b9d9d0}.t2 .logo{position:absolute;left:36px;top:92px;width:88px;height:88px;margin:0;border:3px solid #e5c66e;background:#fff;color:#064f43}.t2 .org{text-align:right;color:#064f43;font-size:20px;border-bottom:2px solid #caa65e;padding-bottom:12px}.t2 .title{text-align:right;color:#064f43;margin:42px 0 22px;font-size:38px}.t2 .to{text-align:right}.t2 .reason{border-right:0;border-left:6px solid #0b806c;background:#edf8f4}.t2 .footer-grid{margin-top:45px;border-top:1px solid #b9d9d0;padding-top:20px}
/* 3 — الوسام المركزي: عنوان داخل وسام ومربعات توقيع */
.t3{padding:68px 88px;background:linear-gradient(180deg,#fffaf8,#fff 35%,#fff9f5)}.t3:before{inset:26px;border:3px solid #7b1d2d;border-radius:34px}.t3:after{inset:39px;border:1px dashed #d3a0a8;border-radius:28px}.t3 .logo{width:116px;height:116px;border:5px double #7b1d2d;box-shadow:0 0 0 10px #fff0f2;margin-bottom:28px}.t3 .org{font-size:17px;letter-spacing:.4px}.t3 .title{display:inline-block;left:50%;transform:translateX(-50%);min-width:62%;padding:14px 34px;margin:30px 0 25px;border-radius:999px;background:#7b1d2d;color:#fff;font-size:31px}.t3 .to{color:#7b1d2d}.t3 .reason{border:2px solid #d6a5ad;border-radius:16px;background:#fff7f8;text-align:center}.t3 .footer-grid{gap:18px}.t3 .footer-grid>div{border:1px solid #e4c7cc;border-radius:16px;padding:14px;background:#fff}
/* 4 — الترويسة الأكاديمية: شريط علوي وعنوان أسفل الشعار */
.t4{padding:180px 72px 72px;background:#f8fbff}.t4:before{inset:0 0 auto 0;height:150px;border:0;background:linear-gradient(100deg,#173b64,#2a6ca3);clip-path:polygon(0 0,100% 0,100% 78%,0 100%)}.t4:after{inset:24px;border:2px solid #83a9c8}.t4 .logo{position:absolute;right:75px;top:32px;width:94px;height:94px;margin:0;border:3px solid #e1c36c;color:#173b64}.t4 .org{position:absolute;right:190px;left:75px;top:48px;color:#fff;text-align:right;font-size:22px}.t4 .title{color:#173b64;text-align:right;margin:18px 0 26px;border-bottom:4px solid #d1ad4e;padding-bottom:12px}.t4 .to{text-align:right;color:#244f85}.t4 .reason{border-right:6px solid #244f85;background:#edf5fb}.t4 .footer-grid{grid-template-columns:38% 1fr;text-align:right}
/* 5 — اللوحة الهندسية: خلفية مائلة ولوحة محتوى مستقلة */
.t5{padding:86px 86px 82px;background:#f7f2fb}.t5:before{inset:auto -120px -180px auto;width:520px;height:520px;border:0;background:#4b3b69;transform:rotate(28deg);border-radius:60px}.t5:after{inset:28px;border:3px solid #4b3b69;clip-path:polygon(0 0,88% 0,100% 9%,100% 100%,12% 100%,0 91%)}.t5 .logo{border-radius:18px;border:3px solid #4b3b69;color:#4b3b69;transform:rotate(-3deg)}.t5 .org{color:#4b3b69}.t5 .title{color:#4b3b69;border:2px solid #b9a6ca;border-radius:18px;padding:12px;background:#fff}.t5 .to{border-bottom:2px solid #4b3b69;padding-bottom:14px}.t5 .body{background:#fff;padding:20px;border-radius:18px;box-shadow:0 4px 18px #4b3b6915}.t5 .reason{border:0;border-radius:18px;background:#ece4f4}.t5 .footer-grid{color:#fff;margin-top:52px}.t5 .footer-grid>div{background:#4b3b69;border-radius:14px;padding:10px}.t5 .date{color:#fff}
/* 6 — الرسمي المبسط: تخطيط أحادي اللون بمحاذاة يمين */
.t6{padding:70px 88px;background:#fff}.t6:before{inset:24px;border:5px solid #222}.t6:after{inset:39px;border:1px solid #aaa}.t6 .logo{margin:0 0 22px auto;border-radius:0;border:3px solid #222;width:82px;height:82px;font-size:38px}.t6 .org{text-align:right;font-size:19px}.t6 .title{text-align:right;color:#111;margin:22px 0 14px;font-size:36px;border-right:9px solid #111;padding:7px 18px 7px 0}.t6 .to{text-align:right;margin:16px 0 24px}.t6 .body{text-align:right;line-height:2}.t6 .reason{border:1px solid #222;border-right:8px solid #222;background:#f5f5f5}.t6 .footer-grid{display:flex;justify-content:space-between;text-align:right;border-top:2px solid #222;padding-top:18px}.t6 .footer-grid>div{width:42%}
@media(max-width:850px){.paper-wrap{overflow:hidden}.paper{transform-origin:top center;transform:scale(.48);margin-bottom:-570px}.fields{grid-template-columns:1fr}.full{grid-column:1}.toolbar{grid-template-columns:1fr 1fr}}@media(min-width:520px) and (max-width:850px){.paper{transform:scale(.7);margin-bottom:-337px}}@media print{@page{size:A4;margin:0}body{background:#fff}.toolbar,.fields{display:none!important}.workspace,.paper-wrap{padding:0!important;overflow:visible!important}.paper{width:210mm;min-height:297mm;margin:0;box-shadow:none;transform:none!important}.designer{display:none}}</style></head><body><div class="toolbar"><select id="template"><option value="t1">1 — الإطار الملكي</option><option value="t2">2 — الشريط الجانبي</option><option value="t3">3 — الوسام المركزي</option><option value="t4">4 — الترويسة الأكاديمية</option><option value="t5">5 — اللوحة الهندسية</option><option value="t6">6 — الرسمي المبسط</option></select><button class="primary" onclick="printLetter()">🖨 طباعة</button><button onclick="savePdf()">📄 حفظ PDF</button><button onclick="resetLetter()">🆕 جديد</button></div><div class="workspace"><div class="fields"><label>الجهة المانحة<input id="org" value="مدرسة القادسية الابتدائية للبنين"></label><label>عنوان الكتاب<input id="title" value="كتاب شكر وتقدير"></label><label>اسم المكرَّم<input id="recipient" value="الأستاذ / ........................"></label><label>الصفة<input id="role" value="معلم المادة"></label><label class="full">نص الشكر<textarea id="bodyText">يسرنا أن نتقدم لكم بخالص الشكر والتقدير لما بذلتموه من جهود مخلصة وعمل دؤوب، سائلين الله تعالى أن يوفقكم لمزيد من العطاء والتميز خدمةً للمسيرة التربوية.</textarea></label><label class="full">سبب الشكر أو الإنجاز<textarea id="reason">تقديراً للجهود المتميزة وحسن الأداء والتعاون.</textarea></label><label>التاريخ<input id="date" value=""></label><label>اسم وتوقيع الجهة المانحة<input id="sign" value="إدارة المدرسة"></label></div><div class="paper-wrap"><section id="paper" class="paper t1"><div class="logo">🏅</div><div id="pOrg" class="org"></div><div id="pTitle" class="title"></div><div id="pTo" class="to"></div><div id="pBody" class="body"></div><div id="pReason" class="reason"></div><div class="footer-grid"><div><div>التاريخ</div><div id="pDate" class="date"></div></div><div><div class="signature">التوقيع</div><div id="pSign"></div></div></div><div class="designer">إعداد: مكتبة أبو بسام للتصوير والقرطاسية</div></section></div></div><script>const KEY='abuBassamThanksLetterV1';const ids=['template','org','title','recipient','role','bodyText','reason','date','sign'];function q(id){return document.getElementById(id)}function read(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}function save(show){let o={};ids.forEach(id=>o[id]=q(id).value);try{localStorage.setItem(KEY,JSON.stringify(o));if(show)alert('تم حفظ كتاب الشكر والتقدير ✓')}catch(e){}}function restore(){let s=read();if(s)ids.forEach(id=>{if(s[id]!=null)q(id).value=s[id]});if(!q('date').value){let d=new Date();q('date').value=d.toLocaleDateString('ar-IQ')}render()}function render(){q('paper').className='paper '+q('template').value;q('pOrg').textContent=q('org').value;q('pTitle').textContent=q('title').value||'كتاب شكر وتقدير';q('pTo').textContent=q('recipient').value+(q('role').value?' — '+q('role').value:'');q('pBody').textContent=q('bodyText').value;q('pReason').textContent=q('reason').value;q('pDate').textContent=q('date').value;q('pSign').textContent=q('sign').value;save(false)}function printable(){let clone=document.documentElement.cloneNode(true);clone.querySelectorAll('script,.toolbar,.fields').forEach(n=>n.remove());return '<!doctype html>'+clone.outerHTML}function printLetter(){save(false);let html=printable();try{if(parent.Android&&parent.Android.printHtml)return parent.Android.printHtml(html)}catch(e){}window.print()}function savePdf(){save(false);let html=printable(),name='Thanks_Letter_'+Date.now()+'.pdf';try{if(parent.Android&&parent.Android.savePdfHtml)return parent.Android.savePdfHtml(name,html)}catch(e){}alert('حفظ PDF متاح داخل تطبيق Android')}function resetLetter(){if(!confirm('بدء كتاب شكر وتقدير جديد؟'))return;localStorage.removeItem(KEY);location.reload()}ids.forEach(id=>q(id).addEventListener('input',render));q('template').addEventListener('change',render);restore();</script></body></html>
