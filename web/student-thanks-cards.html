<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>الشكر والتقدير للتلاميذ</title><style>*{box-sizing:border-box}body{margin:0;background:#eee8df;color:#211d1a;font-family:Tahoma,Arial,sans-serif}.top{position:sticky;top:0;z-index:20;background:#06483e;color:#fff;padding:9px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.top button,.top select{min-height:42px;border:0;border-radius:10px;background:#fff;color:#06483e;font-weight:900}.wrap{max-width:920px;margin:auto;padding:10px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;background:#fff;border-radius:15px}.fields label{font-size:10px;font-weight:900;color:#65594f}.fields input,.fields textarea,.fields select{width:100%;margin-top:4px;padding:9px;border:1px solid #d7c8bb;border-radius:9px;background:#fff;color:#222;font:700 11px Tahoma}.fields textarea{min-height:64px;resize:vertical}.full{grid-column:1/-1}.preview-title{margin:12px 0 7px;font-weight:900}.sheet{position:relative;aspect-ratio:210/297;background:#fff;overflow:hidden;box-shadow:0 8px 26px #0003;margin:auto;max-width:760px;color:var(--ink,#3c2a1f);--p:#7a542f;--a:#d4ad62;--ink:#3c2a1f}.frame{position:absolute;inset:5%;border:5px double var(--a);border-radius:20px}.orn1,.orn2{position:absolute;font-size:70px;color:var(--a);opacity:.18}.orn1{right:5%;top:4%}.orn2{left:5%;bottom:4%;transform:rotate(180deg)}.brand{position:absolute;right:10%;left:10%;top:8%;text-align:center;font-size:clamp(9px,2.1vw,18px);font-weight:900;color:var(--p)}.title{position:absolute;right:10%;left:10%;top:21%;text-align:center;font-size:clamp(22px,6vw,48px);font-weight:900;color:var(--p)}.subtitle{position:absolute;right:15%;left:15%;top:34%;text-align:center;font-size:clamp(9px,2vw,17px);font-weight:800}.student{position:absolute;right:13%;left:13%;top:43%;text-align:center;padding:2.5%;font-size:clamp(18px,4.8vw,40px);font-weight:900;color:var(--p);border-bottom:3px solid var(--a)}.body{position:absolute;right:13%;left:13%;top:56%;text-align:center;font-size:clamp(9px,2vw,17px);line-height:2;font-weight:700}.meta{position:absolute;right:12%;left:12%;bottom:14%;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center;font-size:clamp(7px,1.55vw,13px);font-weight:800}.sign{position:absolute;right:12%;left:12%;bottom:7%;display:flex;justify-content:space-between;font-size:clamp(7px,1.5vw,12px);font-weight:900}.t2{--p:#184f73;--a:#78b5d7}.t2 .frame{border:0;box-shadow:inset 0 0 0 6px var(--p),inset 0 0 0 12px #fff,inset 0 0 0 15px var(--a)}.t2 .title{top:18%}.t2 .student{top:41%;border:2px solid var(--a);border-radius:999px}.t3{--p:#6e2449;--a:#d59ab9}.t3 .frame{border-radius:50px 10px}.t3 .title{text-align:right;right:13%;left:35%}.t3 .student{text-align:right;right:13%;left:20%;border:0}.t3 .orn1{content:'♥'}.t4{--p:#2f613a;--a:#9cc67b}.t4 .frame{border-style:solid}.t4 .brand{text-align:right}.t4 .title{top:19%;border-right:8px solid var(--a);padding-right:3%;text-align:right}.t4 .student{border:0;background:#edf7e8;border-radius:18px}.t5{--p:#3f3574;--a:#b8a6ec}.t5 .frame{border-radius:50%;inset:3% 8%}.t5 .title{top:20%}.t5 .student{top:45%;border:0}.t5 .body{top:57%}.t6{--p:#8b5b12;--a:#ddb85d}.t6 .frame{border:10px solid transparent;outline:4px solid var(--a)}.t6 .title{top:18%;background:linear-gradient(90deg,transparent,#fff4d8,transparent);padding:2%}.t6 .student{top:43%;border:3px double var(--a)}.t7{--p:#333;--a:#999;--ink:#111}.t7 .sheet{filter:grayscale(1)}.t7 .frame{border:3px solid #111;border-radius:0}.t7 .title{letter-spacing:2px}.t7 .student{border-bottom:2px solid #111}.t8{--p:#7f1d1d;--a:#e0b65b}.t8 .frame{border:6px double var(--a);clip-path:polygon(4% 0,96% 0,100% 4%,100% 96%,96% 100%,4% 100%,0 96%,0 4%)}.t8 .title{top:19%;transform:rotate(-1deg)}.t8 .student{background:#fff8e7;border:0;box-shadow:0 0 0 3px var(--a)}.t9{--p:#0f5d62;--a:#79c9c5}.t9 .frame{border:0;border-right:16px solid var(--p);border-left:5px solid var(--a);border-radius:0}.t9 .brand,.t9 .title,.t9 .student,.t9 .body{text-align:right}.t9 .student{right:15%;left:9%}.t10{--p:#1e3a8a;--a:#f0c94d}.t10 .frame{border:0;background:linear-gradient(135deg,var(--p) 0 3%,transparent 3% 97%,var(--a) 97%);box-shadow:inset 0 0 0 3px #d8dce9}.t10 .title{top:18%;color:var(--p)}.t10 .student{top:42%;border:0;border-radius:16px;background:#eef3ff}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.actions button{min-height:44px;border:0;border-radius:11px;background:#087f72;color:#fff;font-weight:900}.actions button:nth-child(2){background:#8b681f}.actions button:nth-child(3){background:#5a4b42}@media(max-width:520px){.fields{grid-template-columns:1fr}.full{grid-column:1}.top{grid-template-columns:1fr 1fr}.top select{grid-column:1/-1}.actions{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}}@media print{.top,.fields,.preview-title,.actions{display:none!important}.wrap{padding:0}.sheet{box-shadow:none;max-width:none}}
</style></head><body><div class="top"><button onclick="saveNow(true)">💾 حفظ</button><button onclick="resetForm()">🆕 جديد</button><select id="template"><option value="t1">1 — الملكي الذهبي</option><option value="t2">2 — الأكاديمي الأزرق</option><option value="t3">3 — الوردي الاحتفالي</option><option value="t4">4 — الأخضر المدرسي</option><option value="t5">5 — الإطار الدائري</option><option value="t6">6 — الذهبي الكلاسيكي</option><option value="t7">7 — الرسمي الأبيض والأسود</option><option value="t8">8 — الخمري المزخرف</option><option value="t9">9 — الشريط الجانبي الحديث</option><option value="t10">10 — الأزرق العصري</option></select></div><div class="wrap"><div class="fields"><label>اسم المدرسة<input id="school" value="مدرسة القادسية الابتدائية للبنين"></label><label>عنوان الشهادة<input id="heading" value="شكر وتقدير"></label><label>اسم التلميذ<input id="student" value=""></label><label>الصف<input id="grade" value=""></label><label class="full">سبب الشكر والتقدير<textarea id="reason">تقديرًا لتميزه والتزامه وجهوده الطيبة، مع تمنياتنا له بمزيد من النجاح والتفوق.</textarea></label><label>التاريخ<input id="date" type="date"></label><label>اسم المعلم<input id="teacher" value="أكرم حاتم الغزالي"></label><label>مدير المدرسة<input id="principal" value=""></label><label>حجم الورق<select id="paper"><option value="A4">A4</option><option value="A5">A5</option></select></label></div><div class="preview-title">معاينة شكر وتقدير للتلاميذ</div><div id="sheet" class="sheet t1"><div class="frame"></div><div class="orn1">❧</div><div class="orn2">❧</div><div id="pSchool" class="brand"></div><div id="pHeading" class="title"></div><div class="subtitle">تتقدم إدارة المدرسة وهيئتها التعليمية بخالص الشكر والتقدير إلى</div><div id="pStudent" class="student"></div><div id="pBody" class="body"></div><div class="meta"><div id="pGrade"></div><div id="pDate"></div><div>مع تمنياتنا بدوام النجاح</div></div><div class="sign"><span id="pTeacher"></span><span id="pPrincipal"></span></div></div><div class="actions"><button onclick="printNow()">🖨 طباعة</button><button onclick="savePdf()">📄 حفظ PDF</button><button onclick="saveNow(true)">💾 حفظ التعديلات</button></div></div><script>const KEY='abuBassamStudentThanksV1',ids=['template','school','heading','student','grade','reason','date','teacher','principal','paper'];const q=id=>document.getElementById(id);function data(){let d={};ids.forEach(id=>d[id]=q(id).value);return d}function saveNow(show=false){try{localStorage.setItem(KEY,JSON.stringify(data()));if(show)alert('تم حفظ نموذج الشكر والتقدير ✓')}catch(e){if(show)alert('تعذر الحفظ')}}function restore(){try{let d=JSON.parse(localStorage.getItem(KEY)||'null');if(d)ids.forEach(id=>{if(d[id]!=null)q(id).value=d[id]})}catch(e){}if(!q('date').value)q('date').value=new Date().toISOString().slice(0,10);render()}function render(){let d=data();q('sheet').className='sheet '+d.template;q('pSchool').textContent=d.school||'اسم المدرسة';q('pHeading').textContent=d.heading||'شكر وتقدير';q('pStudent').textContent=d.student||'اسم التلميذ';q('pBody').textContent=d.reason||'';q('pGrade').textContent='الصف: '+(d.grade||'—');q('pDate').textContent='التاريخ: '+(d.date||'—');q('pTeacher').textContent='المعلم: '+(d.teacher||'—');q('pPrincipal').textContent='مدير المدرسة: '+(d.principal||'—');saveNow(false)}function printable(){let paper=q('paper').value,size=paper==='A5'?'148mm 210mm':'210mm 297mm',sheet=q('sheet').outerHTML,css=document.querySelector('style').textContent;return '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>@page{size:'+size+';margin:0}*{box-sizing:border-box}html,body{margin:0;background:#fff;font-family:Tahoma,Arial,sans-serif}.sheet{width:'+size.split(' ')[0]+';height:'+size.split(' ')[1]+';max-width:none;aspect-ratio:auto;box-shadow:none}'+css+' .top,.fields,.preview-title,.actions{display:none!important}</style></head><body>'+sheet+'</body></html>'}function printNow(){let html=printable();try{if(parent.Android&&parent.Android.printHtml)return parent.Android.printHtml(html)}catch(e){}let w=open('','_blank');w.document.write(html);w.document.close();setTimeout(()=>w.print(),300)}function savePdf(){let html=printable(),name='Student_Thanks_'+Date.now()+'.pdf';try{if(parent.Android&&parent.Android.savePdfHtml)return parent.Android.savePdfHtml(name,html)}catch(e){}alert('حفظ PDF متاح داخل تطبيق Android')}function resetForm(){if(!confirm('بدء نموذج جديد؟'))return;localStorage.removeItem(KEY);location.reload()}ids.forEach(id=>q(id).addEventListener('input',render));q('template').addEventListener('change',render);const wanted=decodeURIComponent((location.hash||'').replace(/^#/,''));if(/^t(?:10|[1-9])$/.test(wanted))q('template').value=wanted;restore();</script></body></html>
