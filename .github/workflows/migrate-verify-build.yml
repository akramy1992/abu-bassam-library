name: Repair, Verify and Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/migrate-verify-build.yml'

permissions:
  contents: write

jobs:
  repair-verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Apply deterministic code repairs
        working-directory: target
        run: python3 tools/repair_migrated_source.py

      - name: Commit repaired code
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/admin-permissions-runtime.js web/device-reconcile-runtime.js
          if git diff --cached --quiet; then
            echo 'Repairs already present.'
          else
            git commit -m 'fix: repair permissions syntax and device reconciliation hooks'
            git push origin HEAD:main
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Refresh lockfile for security overrides
        working-directory: target
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply available non-breaking npm security fixes
        working-directory: target
        shell: bash
        run: |
          npm audit fix --package-lock-only --omit=dev || true

      - name: Install dependencies exactly
        working-directory: target
        run: npm ci

      - name: Persist security lockfile updates
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
          else
            git commit -m 'security: refresh compatible dependency resolutions'
            git push origin HEAD:main
          fi

      - name: Check repaired JavaScript syntax
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          node --check web/admin-permissions-runtime.js
          node --check web/device-reconcile-runtime.js

      - name: Run strict project checks
        working-directory: target
        run: npm run check:web

      - name: Run HTML script integrity check
        working-directory: target
        run: node tools/check_html_scripts.js

      - name: Verify Expo configuration
        working-directory: target
        run: npx expo config --type public >/tmp/expo-config.json

      - name: Gate High and Critical production dependency advisories
        working-directory: target
        run: npm audit --omit=dev --audit-level=high

      - name: Prepare Android project
        working-directory: target
        run: npm run android:prebuild

      - name: Build Android debug APK
        working-directory: target/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abu-bassam-library-debug-apk
          path: target/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

# Verification revision: run compatible image-size 1.x security fork and picomatch patch.
