name: Migrate, Verify and Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/migrate-verify-build.yml'

permissions:
  contents: write

env:
  SOURCE_REPO: ssakram134-cyber/abu-bassam-library
  SOURCE_COMMIT: 69b7b488bafcb30e3e2d00af5bfd5ff6b105b6d3

jobs:
  migrate-verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Validate migration token
        shell: bash
        env:
          OLD_REPO_TOKEN: ${{ secrets.OLD_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$OLD_REPO_TOKEN" || { echo 'Missing OLD_REPO_TOKEN secret'; exit 1; }

      - name: Checkout verified source repository
        uses: actions/checkout@v4
        with:
          repository: ssakram134-cyber/abu-bassam-library
          ref: ${{ env.SOURCE_COMMIT }}
          token: ${{ secrets.OLD_REPO_TOKEN }}
          path: source
          fetch-depth: 1

      - name: Verify exact source commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C source rev-parse HEAD)"
          test "$actual" = "$SOURCE_COMMIT" || { echo "Source mismatch: $actual"; exit 1; }

      - name: Copy full source without Git metadata
        shell: bash
        run: |
          set -euo pipefail
          cp target/.github/workflows/migrate-verify-build.yml /tmp/migrate-verify-build.yml
          rsync -a --delete \
            --exclude '.git/' \
            source/ target/
          mkdir -p target/.github/workflows
          cp /tmp/migrate-verify-build.yml target/.github/workflows/migrate-verify-build.yml

      - name: Commit migrated source snapshot
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'build: migrate audited Abu Bassam source snapshot'
            git push origin HEAD:main
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Install dependencies exactly
        working-directory: target
        run: npm ci

      - name: Run strict project checks
        working-directory: target
        run: npm run check:web

      - name: Run HTML/script integrity check
        working-directory: target
        run: node tools/check_html_scripts.js

      - name: Verify Expo configuration
        working-directory: target
        run: npx expo config --type public >/tmp/expo-config.json

      - name: Prepare Android project
        working-directory: target
        run: npm run android:prebuild

      - name: Build Android debug APK
        working-directory: target/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abu-bassam-library-debug-apk
          path: target/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
