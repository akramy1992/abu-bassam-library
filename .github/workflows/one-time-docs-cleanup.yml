name: One-time docs cleanup
on:
  push:
    branches: [main]
    paths:
      - 'tools/one-time-docs-cleanup.py'
      - '.github/workflows/one-time-docs-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply docs cleanup
        run: python3 tools/one-time-docs-cleanup.py
      - name: Verify docs
        run: node tools/check_docs_current_state.js
      - name: Commit docs cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: remove stale question compression and input references'
          git push origin main
