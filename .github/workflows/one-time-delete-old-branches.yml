name: One-time delete obsolete branches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-delete-old-branches.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  delete-obsolete-branches:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Delete obsolete rebuild branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in clean-rebuild-v6 fresh-rebuild-20260928-v5; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
          test -z "$(git ls-remote --heads origin clean-rebuild-v6 fresh-rebuild-20260928-v5)"
