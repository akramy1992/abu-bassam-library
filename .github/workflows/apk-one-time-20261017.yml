name: One-time Abu Bassam 6.0.0 APK test build

on:
  push:
    branches:
      - build/apk-6-0-0-20261017

permissions:
  contents: read

jobs:
  build-android-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      NODE_ENV: production
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run source and security checks
        run: npm run check:web
      - name: Verify Expo config
        run: npx expo config --type public
      - name: Prebuild Android and bundle offline assets
        run: npm run android:prebuild
      - name: Build fresh test-signed APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify APK integrity signature and provenance
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -n "$APK"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fxq 'assets/index.android.bundle'
          test "$(unzip -p "$APK" assets/index.android.bundle | wc -c)" -gt 1000
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -n "$BT"
          "$BT/apksigner" verify --verbose "$APK"
          mkdir -p dist
          VERSION="$(node -p "require('./app.json').expo.version")"
          CODE="$(node -p "require('./app.json').expo.android.versionCode")"
          NAME="Abu_Bassam_Library_${VERSION}_Build_${CODE}_TEST_${GITHUB_SHA:0:12}.apk"
          cp "$APK" "dist/$NAME"
          "$BT/apksigner" verify --print-certs "dist/$NAME" > dist/SIGNING_CERTIFICATE.txt
          sha256sum "dist/$NAME" > dist/SHA256.txt
          printf 'TEST-SIGNED-APK: NOT FOR DIRECT PRODUCTION APP UPDATES\ncommit=%s\nversion=%s\nversionCode=%s\n' "$GITHUB_SHA" "$VERSION" "$CODE" > dist/BUILD_TYPE.txt
          ls -lh dist/*
      - name: Upload newly built APK
        uses: actions/upload-artifact@v4
        with:
          name: abu-bassam-6-0-0-new-test-apk-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
