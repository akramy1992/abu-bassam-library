name: One-time apply validated source repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-repository-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-validated-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply the source repair already validated by Android build run 36530484840
        run: |
          python3 tools/one-time-repository-repair.py
          python3 tools/one-time-repository-repair-fix.py
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Re-run strict source checks
        run: npm run check:web
      - name: Keep workflow changes out of the bot commit
        run: |
          git checkout HEAD -- .github/workflows
          rm -rf android dist .expo .cache web/vendor/tesseract
          rm -f tools/one-time-repository-repair.py
          rm -f tools/one-time-repository-repair-fix.py
      - name: Commit validated non-workflow source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/workflows'
          git diff --cached --check
          git commit -m 'refactor: make clean source authoritative and release-ready'
          git push origin main
