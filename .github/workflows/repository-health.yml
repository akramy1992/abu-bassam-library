name: Repository health
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Only the dedicated draft diagnostic branch may use its independent package ID.
      ABU_BASSAM_DIAGNOSTIC_BUILD: ${{ startsWith(github.head_ref, 'diagnostic/offline-no-login-') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:web
      - run: npx expo config --type public >/tmp/expo-config.json
