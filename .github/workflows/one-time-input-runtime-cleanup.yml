name: One-time input runtime cleanup
on:
  push:
    branches: [main]
    paths:
      - 'tools/one-time-input-runtime-cleanup.py'
      - 'tools/one-time-global-observer-cleanup.py'
      - 'tools/one-time-last-observer-cleanup.py'
      - '.github/workflows/one-time-input-runtime-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply final input runtime cleanup
        run: python3 tools/one-time-input-runtime-cleanup.py
      - name: Replace document-wide runtime observers
        run: python3 tools/one-time-global-observer-cleanup.py
      - name: Remove final three document-wide observers
        run: python3 tools/one-time-last-observer-cleanup.py
      - name: Verify input and crash stability
        run: node tools/check_input_and_crash_stability.js
      - name: Verify JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),vm=require('vm');
          let failed=false;
          for(const file of fs.readdirSync('web').filter(f=>f.endsWith('.js'))){
            try{new vm.Script(fs.readFileSync(path.join('web',file),'utf8'),{filename:file});}
            catch(e){failed=true;console.error(file+': '+e.message);}
          }
          if(failed)process.exit(1);
          console.log('All web JavaScript files compile successfully.');
          NODE
      - name: Verify package json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json valid')"
      - name: Remove one-time cleanup files
        run: |
          rm -f tools/one-time-input-runtime-cleanup.py
          rm -f tools/one-time-global-observer-cleanup.py
          rm -f tools/one-time-last-observer-cleanup.py
          rm -f .github/workflows/one-time-input-runtime-cleanup.yml
      - name: Commit corrected runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove legacy touch handlers and global runtime interception'
          git push origin main
