name: One-time offline no-login diagnostic APK
on:
  push:
    branches:
      - diagnostic/offline-no-login-20261017
permissions:
  contents: read
jobs:
  build-offline-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      NODE_ENV: production
      ABU_BASSAM_DIAGNOSTIC_BUILD: '1'
    steps:
      - name: Checkout diagnostic source revision
        uses: actions/checkout@v4
      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify no-login sandbox and build source
        run: |
          node tools/check_diagnostic_sandbox.js
          npm run check:web
      - name: Verify diagnostic Expo config
        run: npx expo config --type public
      - name: Prebuild Android from clean offline diagnostic source
        run: npm run android:prebuild
      - name: Build fresh independently installable APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Inspect package identity, permissions, assets and signing
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fxq 'assets/library/index.html'
          unzip -Z1 "$APK" | grep -Fxq 'assets/library/device-name-runtime.js'
          unzip -Z1 "$APK" | grep -Fxq 'assets/index.android.bundle'
          unzip -p "$APK" assets/library/device-name-runtime.js | grep -q 'OFFLINE_DIAGNOSTIC_ONLY'
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -x "$BT/apksigner"
          test -x "$BT/aapt"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | grep -Fq "package: name='com.abubassam.librarycamera3.diagnostic'"
          mkdir -p dist
          "$BT/aapt" dump permissions "$APK" > dist/MANIFEST_PERMISSIONS.txt
          if grep -q 'android.permission.INTERNET' dist/MANIFEST_PERMISSIONS.txt; then
            echo 'ERROR: DIAGNOSTIC APK HAS INTERNET PERMISSION'
            exit 1
          fi
          VERSION="$(node -p "require('./app.json').expo.version")"
          CODE="$(node -p "require('./app.json').expo.android.versionCode")"
          NAME="Abu_Bassam_OFFLINE_NO_LOGIN_DIAGNOSTIC_${VERSION}_${CODE}_${GITHUB_SHA:0:12}.apk"
          cp "$APK" "dist/$NAME"
          sha256sum "dist/$NAME" > dist/SHA256.txt
          "$BT/apksigner" verify --print-certs "dist/$NAME" > dist/SIGNING_CERTIFICATE.txt
          printf 'OFFLINE NO LOGIN DIAGNOSTIC. SEPARATE PACKAGE; NO NETWORK; NO PRODUCTION ACCOUNT ACCESS. TEST-SIGNED.\ncommit=%s\n' "$GITHUB_SHA" > dist/BUILD_TYPE.txt
          ls -lh dist/
      - name: Upload isolated diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: abu-bassam-offline-no-login-diagnostic-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
