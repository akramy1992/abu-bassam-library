name: One-time remove obsolete env-10 residue
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-remove-env10-residue.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean-env10:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Remove contradictory env-10 runtime residue
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def remove_function(src,name):
              start=src.find(f'function {name}(')
              if start<0:
                  raise SystemExit(f'missing function {name}')
              brace=src.find('{',start)
              if brace<0:
                  raise SystemExit(f'missing opening brace for {name}')
              depth=0
              quote=None
              escape=False
              for i in range(brace,len(src)):
                  ch=src[i]
                  if quote:
                      if escape:
                          escape=False
                      elif ch=='\\':
                          escape=True
                      elif ch==quote:
                          quote=None
                      continue
                  if ch in ('\"',"'"):
                      quote=ch
                      continue
                  if ch=='{': depth+=1
                  elif ch=='}':
                      depth-=1
                      if depth==0:
                          return src[:start]+src[i+1:]
              raise SystemExit(f'unclosed function {name}')

          fixes_path=Path('web/cards-hardening-fixes-runtime.js')
          fixes=fixes_path.read_text()
          fixes=remove_function(fixes,'protectEnvelope10')
          fixes=fixes.replace(';protectEnvelope10(doc,win)','').replace('protectEnvelope10(doc,win);','')
          if 'env-10' in fixes or 'protectEnvelope10' in fixes:
              raise SystemExit('env-10/protectEnvelope10 residue remains in cards-hardening-fixes-runtime.js')
          fixes_path.write_text(fixes)

          hard_path=Path('web/cards-hardening-runtime.js')
          hard=hard_path.read_text()
          hard=remove_function(hard,'promoteEnvelope10')
          hard=hard.replace(';promoteEnvelope10(doc,win)','').replace('promoteEnvelope10(doc,win);','')
          if 'env-10' in hard or 'promoteEnvelope10' in hard:
              raise SystemExit('env-10/promoteEnvelope10 residue remains in cards-hardening-runtime.js')
          hard_path.write_text(hard)

          test_path=Path('tools/check_cards_hardening_latest.js')
          test=test_path.read_text()
          if "const hard=read('web/cards-hardening-runtime.js');" not in test:
              test=test.replace("const fixes=read('web/cards-hardening-fixes-runtime.js');\n", "const fixes=read('web/cards-hardening-fixes-runtime.js');\nconst hard=read('web/cards-hardening-runtime.js');\n")
          test=test.replace('new Function(fixes);new Function(upgrades);new Function(finalAudit);new Function(envelopePreload);new Function(plus);', 'new Function(fixes);new Function(hard);new Function(upgrades);new Function(finalAudit);new Function(envelopePreload);new Function(plus);')
          test='\n'.join(line for line in test.splitlines() if "__abuTemplateDeleteGuard=prev.__abuTemplateDeleteGuard===true" not in line)+'\n'
          anchor="reject(envelopePreload,\"id:'env-10'\",'obsolete env-10 template is still being injected');\n"
          checks=(
              "need(envelopePreload,\"state.templateId==='env-10'\",'saved obsolete env-10 state must be detected');\n"
              "need(envelopePreload,\"state.templateId='env-1'\",'saved obsolete env-10 state must migrate to env-1');\n"
              "reject(fixes,'env-10','obsolete env-10 protection remains in final fixes runtime');\n"
              "reject(hard,'env-10','obsolete env-10 promotion remains in hardening runtime');\n"
          )
          if checks not in test:
              if anchor not in test: raise SystemExit('cards test anchor missing')
              test=test.replace(anchor,anchor+checks)
          test_path.write_text(test)

          allowed=Path('web/envelope-preload-runtime.js')
          for p in Path('web').glob('*'):
              if not p.is_file() or p==allowed: continue
              if p.suffix.lower() not in {'.js','.html'}: continue
              if 'env-10' in p.read_text(errors='ignore'):
                  raise SystemExit(f'obsolete env-10 residue remains in {p}')
          print('obsolete env-10 runtime residue removed; only forward migration remains')
          PY
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify full source after cleanup
        run: npm run check:web
      - name: Commit only validated runtime cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/cards-hardening-fixes-runtime.js web/cards-hardening-runtime.js tools/check_cards_hardening_latest.js
          git diff --cached --check
          git commit -m 'cleanup: remove obsolete env-10 runtime promotion'
          git push origin main
