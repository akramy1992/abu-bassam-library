name: One-time touch and crash cleanup
on:
  push:
    branches: [main]
    paths:
      - 'tools/one-time-touch-crash-cleanup.py'
      - '.github/workflows/one-time-touch-crash-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply touch and crash cleanup
        run: python3 tools/one-time-touch-crash-cleanup.py
      - name: Verify stability guard
        run: node tools/check_input_and_crash_stability.js
      - name: Remove one-time files
        run: |
          rm -f tools/one-time-touch-crash-cleanup.py
          rm -f .github/workflows/one-time-touch-crash-cleanup.yml
      - name: Commit cleaned source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove global touch interception and recover WebView crashes'
          git push origin main
