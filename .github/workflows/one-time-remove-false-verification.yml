name: One-time remove false verification claims
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-remove-false-verification.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove unsupported verification wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/IMAGE-EDITING-PRINT-POSTER-SPEC-2026-09-24.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('لا تُعتبر أي ميزة «تم ✅» لمجرد وجود زر أو كود جزئي؛ يجب أن تعمل من الواجهة حتى الناتج النهائي.','وجود زر أو كود جزئي لا يثبت نجاح الميزة؛ يجب التحقق من عملها من الواجهة حتى الناتج النهائي.')
          s=s.replace('لا تُكتب «تم ✅» إلا بعد تحقق مناسب. يجب فحص:','نتيجة هذا القسم لا تُعتمد من المواصفة وحدها. يجب فحص:')
          p.write_text(s,encoding='utf-8')

          p=Path('docs/NOTIFICATION-CENTER-SPEC-2026-09-24.md')
          s=p.read_text(encoding='utf-8')
          marker='## حالات التحقق — 2026-09-24'
          if marker in s:
              s=s.split(marker,1)[0].rstrip()+"\n\n## التحقق\nهذا الملف مواصفة متطلبات، وليس تقرير نجاح. نتائج الاختبارات تؤخذ من الفحص الآلي الحالي أو من الاختبار الميداني الفعلي، ولا تُحفظ هنا كحقيقة دائمة.\n"
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify documentation truth
        run: node tools/check_docs_current_state.js
      - name: Remove one-time workflow
        run: rm -f .github/workflows/one-time-remove-false-verification.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: remove unsupported verification claims'
          git push origin main
